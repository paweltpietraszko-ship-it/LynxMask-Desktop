# test_pipeline.py to własny runner HTTP — uruchamiać przez python tests/test_pipeline.py
[pytest]
testpaths = tests
python_files = test_pseudominizer.py test_pipeline_v2.py test_anonymizer_adversarial.py test_output_guard_adversarial.py test_pipeline_adversarial.py test_archive_adversarial.py
log_file = pytest.log
log_file_level = DEBUG
log_file_format = %(asctime)s %(levelname)-8s %(name)s: %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S
