[package]
name = "pseudominizer"
version = "1.0.0"
description = "Pseudominizer — lokalna pseudonimizacja RODO"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri    = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde    = { version = "1", features = ["derive"] }
serde_json = "1"

# Krypto
aes-gcm  = "0.10"
pbkdf2   = { version = "0.12", features = ["hmac"] }
sha2     = "0.10"
hmac     = "0.12"
rand     = "0.8"
reqwest  = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
base64   = "0.22"
tokio    = { version = "1", features = ["rt"] }

[profile.release]
opt-level = "z"
lto       = true
codegen-units = 1
strip     = true
